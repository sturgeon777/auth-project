<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>행성 게임</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="planet-game.js"></script>
</head>
<body>

  <header class="top-header">
    <div class="brand-logo">행성 게임</div>
  </header>

  <div class="top-stats">
    <div class="stat-item">
      <div class="stat-value" id="statTotalPlayers">0</div>
      <div class="stat-label">Total Players</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="statGamesPlayed">0</div>
      <div class="stat-label">Games Played</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="statHoursPlayed">0</div>
      <div class="stat-label">Hours Played</div>
    </div>
  </div>

  <div id="authSection" class="auth-container">
    <div class="form-box">
      <h3>행성 게임에 오신 것을 환영합니다</h3>
      <p class="subtitle">Enter a username to join, or login with your existing account.</p>
      <input type="text" id="authUser" placeholder="USERNAME" required>
      <input type="password" id="authPass" placeholder="PASSWORD" required>
      <button type="button" class="btn-tetrio" onclick="handleAuth()">JOIN</button>
    </div>
  </div>

  <div id="gameSection" style="display: none;">
    <div class="user-bar">
      <div class="user-info">
        USER: <strong id="usernameDisplay"></strong> (BEST SCORE: <strong id="highScoreDisplay">0</strong>)
      </div>
      <button type="button" class="btn-tetrio secondary" style="width: auto; padding: 6px 16px; font-size: 0.9rem;" onclick="logout()">LOGOUT</button>
    </div>

    <div class="controls-panel">
      <button type="button" class="btn-tetrio" style="width: auto; padding: 10px 20px; font-size: 0.95rem;" onclick="startSingleGame()">SINGLEPLAYER</button>
      <button type="button" class="btn-tetrio secondary" id="btnMatchmaking" style="width: auto; padding: 10px 20px; font-size: 0.95rem;" onclick="toggleMatchmaking()">1 VS 1</button>
      <button type="button" class="btn-tetrio secondary" style="width: auto; padding: 10px 20px; font-size: 0.95rem;" onclick="openSettingsModal()">SETTINGS</button>
    </div>

    <p id="gameStatus" class="status-text"></p>

    <div class="layout-container" id="layoutContainer">
      <div class="canvas-wrap">
        <canvas id="gameCanvas" width="800" height="800"></canvas>
        <div class="canvas-overlay-container" id="canvasOverlayContainer"></div>
      </div>

      <div id="opponentBox" class="opponent-box">
        <h3 id="opponentTitle">OPPONENT</h3>
        <canvas id="opponentCanvas" width="400" height="400"></canvas>
      </div>

      <div class="leaderboard-box">
        <h3>TOP 10 LEADERBOARD</h3>
        <ol id="leaderboardList"></ol>
        <h3 class="chain-title">PLANETS</h3>
        <canvas id="planetChain" width="240" height="130"></canvas>
      </div>
    </div>
  </div>

  <!-- 테마 설정 모달 -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-content">
      <h3>SETTINGS</h3>
      <div class="setting-row">
        <label>THEME MODE</label>
        <div class="theme-btn-group">
          <button type="button" class="btn-tetrio" id="btnThemeDark" onclick="setTheme('dark')">DARK</button>
          <button type="button" class="btn-tetrio secondary" id="btnThemeLight" onclick="setTheme('light')">LIGHT</button>
        </div>
      </div>
      <button type="button" class="btn-tetrio" style="margin-top: 25px;" onclick="closeSettingsModal()">CONFIRM</button>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('jwtToken');
    let currentUser = localStorage.getItem('username');
    let socket = null;
    let gameIdPromise = Promise.resolve(null);

    // mode: 'idle' | 'single' | 'match'
    let mode = 'idle';
    let isMatchmaking = false;
    let opponentName = '';
    let opponentBoard = null;
    let matchEndsAt = 0;
    let lastBoardSentAt = 0;
    let boardMessage = { text: '', sub: '' };

    const BOARD_SEND_INTERVAL_MS = 100;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const oppCanvas = document.getElementById('opponentCanvas');
    const oppCtx = oppCanvas.getContext('2d');

    const game = new PlanetGame({
      onGameOver: (score) => {
        if (mode === 'single') {
          boardMessage = { text: 'GAME OVER', sub: `SCORE ${score} · SINGLEPLAYER를 눌러 다시 시작` };
          submitScore(score);
        } else if (mode === 'match') {
          boardMessage = { text: 'GAME OVER', sub: '상대 결과를 기다리는 중...' };
          sendBoard(true);
        }
      }
    });

    window.onload = async () => {
      initTheme();
      await fetchGlobalStats();

      token = localStorage.getItem('jwtToken');
      currentUser = localStorage.getItem('username');

      if (token && currentUser) {
        await restoreSession();
      } else {
        showAuthView();
      }
    };

    // ---------- 테마 / 설정 ----------

    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      setTheme(savedTheme);
    }

    function isLightMode() {
      return document.body.classList.contains('light-mode');
    }

    function setTheme(themeMode) {
      if (themeMode === 'light') {
        document.body.classList.add('light-mode');
      } else {
        document.body.classList.remove('light-mode');
      }
      localStorage.setItem('theme', themeMode);
      updateThemeButtons();
      PlanetGame.drawPlanetChain(document.getElementById('planetChain').getContext('2d'), isLightMode());
    }

    function updateThemeButtons() {
      const currentTheme = localStorage.getItem('theme') || 'dark';
      const btnDark = document.getElementById('btnThemeDark');
      const btnLight = document.getElementById('btnThemeLight');

      if (!btnDark || !btnLight) return;

      if (currentTheme === 'light') {
        btnLight.classList.remove('secondary');
        btnDark.classList.add('secondary');
      } else {
        btnDark.classList.remove('secondary');
        btnLight.classList.add('secondary');
      }
    }

    function openSettingsModal() {
      document.getElementById('settingsModal').style.display = 'flex';
      updateThemeButtons();
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    // ---------- 로그인 / 통계 ----------

    async function fetchGlobalStats() {
      try {
        const res = await fetch('/api/stats');
        if (res.ok) {
          const data = await res.json();
          document.getElementById('statTotalPlayers').innerText = Number(data.totalPlayers || 0).toLocaleString();
          document.getElementById('statGamesPlayed').innerText = Number(data.gamesPlayed || 0).toLocaleString();
          document.getElementById('statHoursPlayed').innerText = data.hoursPlayed || 0;
        }
      } catch (e) {
        console.error('Stats load error:', e);
      }
    }

    async function restoreSession() {
      try {
        const res = await fetch('/api/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) {
          // 만료되었거나 예전 방식의 토큰이면 다시 로그인하게 한다
          clearSession();
          showAuthView();
          return;
        }
        const data = await res.json();
        currentUser = data.username;
        showGameView(data.highScore);
      } catch (e) {
        console.error('Session restore error:', e);
        showGameView(0);
      }
    }

    function saveSession(data) {
      token = data.token;
      currentUser = data.username;
      localStorage.setItem('jwtToken', token);
      localStorage.setItem('username', currentUser);
    }

    function clearSession() {
      token = null;
      currentUser = null;
      localStorage.removeItem('jwtToken');
      localStorage.removeItem('username');
    }

    function showAuthView() {
      document.getElementById('authSection').style.display = 'flex';
      document.getElementById('gameSection').style.display = 'none';
    }

    function showGameView(highScore = 0) {
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('gameSection').style.display = 'block';
      document.getElementById('usernameDisplay').innerText = currentUser || '';
      document.getElementById('highScoreDisplay').innerText = highScore;
      loadLeaderboard();
      fetchGlobalStats();
    }

    async function handleAuth() {
      const username = document.getElementById('authUser').value.trim();
      const password = document.getElementById('authPass').value.trim();
      if (!username || !password) return alert('아이디와 비밀번호를 입력하세요.');

      try {
        const loginRes = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const loginData = await loginRes.json();

        if (loginRes.ok) {
          saveSession(loginData);
          showGameView(loginData.highScore);
          return;
        }
        if (loginRes.status === 429) {
          return alert(loginData.message);
        }

        // 로그인 실패 시 새 계정 생성을 시도한다
        const regRes = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const regData = await regRes.json();

        if (regRes.ok) {
          alert('새 계정이 생성되었습니다.');
          saveSession(regData);
          showGameView(regData.highScore);
        } else if (regRes.status === 409) {
          alert('비밀번호가 일치하지 않습니다.');
        } else {
          alert(regData.message || '계정을 만들 수 없습니다.');
        }
      } catch (e) {
        console.error('Auth error:', e);
        alert('서버에 연결할 수 없습니다.');
      }
    }

    function logout() {
      clearSession();
      location.reload();
    }

    async function loadLeaderboard() {
      try {
        const res = await fetch('/api/leaderboard');
        if (res.ok) {
          const list = await res.json();
          const listEl = document.getElementById('leaderboardList');
          // 아이디에 HTML이 섞여 있어도 실행되지 않도록 textContent로 넣는다
          listEl.replaceChildren(...list.map(item => {
            const li = document.createElement('li');
            li.textContent = `${item.username}: ${item.highScore} PTS`;
            return li;
          }));
        }
      } catch (e) {
        console.error('Leaderboard load error:', e);
      }
    }

    function setStatus(text) {
      const el = document.getElementById('gameStatus');
      if (el.innerText !== text) el.innerText = text;
    }

    // ---------- 싱글플레이 ----------

    function startSingleGame() {
      if (mode === 'match') {
        return alert('1대1 대결이 끝난 뒤에 시작할 수 있습니다.');
      }
      if (isMatchmaking) cancelMatchmaking();

      mode = 'single';
      boardMessage = { text: '', sub: '' };
      setOpponentBoxVisible(false);
      document.getElementById('canvasOverlayContainer').innerHTML = '';
      setStatus('');

      game.reset();
      game.running = true;

      // 서버에 게임 시작을 알려 두어야 끝났을 때 점수가 인정된다
      gameIdPromise = fetch('/api/game/start', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` }
      })
        .then(res => res.ok ? res.json() : null)
        .then(data => data?.gameId || null)
        .catch(() => null);
    }

    async function submitScore(score) {
      try {
        const gameId = await gameIdPromise;
        const res = await fetch('/api/score', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ gameId, score })
        });
        if (res.status === 401) {
          alert('로그인이 만료되었습니다. 다시 로그인하세요.');
          return logout();
        }
        if (res.ok) {
          const data = await res.json();
          document.getElementById('highScoreDisplay').innerText = data.highScore;
        }
      } catch (e) {
        console.error('Score submit error:', e);
      }

      loadLeaderboard();
      fetchGlobalStats();
    }

    // ---------- 1대1 점수 대결 ----------

    function setOpponentBoxVisible(visible) {
      document.getElementById('layoutContainer').classList.toggle('dual-mode', visible);
      document.getElementById('opponentBox').classList.toggle('active', visible);
    }

    function showCountdownUI(count) {
      const overlay = document.getElementById('canvasOverlayContainer');
      if (count === 'START') {
        overlay.innerHTML = '<div class="countdown-overlay" style="color: #00ff88;">GO!</div>';
        setTimeout(() => { overlay.innerHTML = ''; }, 800);
      } else {
        overlay.innerHTML = `<div class="countdown-overlay">${Number(count)}</div>`;
      }
    }

    function initSocket() {
      if (socket) return;
      socket = io({ auth: { token } });

      socket.on('connect_error', (err) => {
        if (err.message === 'unauthorized') {
          alert('로그인이 만료되었습니다. 다시 로그인하세요.');
          logout();
        }
      });

      socket.on('waiting', (data) => {
        setStatus(data?.message || '상대를 찾는 중입니다...');
      });

      socket.on('matchFound', (data) => {
        isMatchmaking = false;
        resetMatchmakingButton();

        mode = 'match';
        opponentName = data.opponent;
        opponentBoard = null;
        matchEndsAt = 0;
        boardMessage = { text: '', sub: '' };
        game.reset();

        document.getElementById('opponentTitle').textContent = opponentName;
        setOpponentBoxVisible(true);
        setStatus(`매칭 완료! 상대: ${opponentName}`);
      });

      socket.on('countdownTick', (data) => {
        showCountdownUI(data.count);
        if (data.count === 'START' && mode === 'match') {
          matchEndsAt = Date.now() + data.remainingMs;
          game.running = true;
        }
      });

      socket.on('opponentBoard', (board) => {
        opponentBoard = board;
        document.getElementById('opponentTitle').textContent = `${opponentName} · ${board.s}`;
      });

      socket.on('matchOver', (data) => {
        if (!game.over) game.running = false;
        mode = 'idle';
        matchEndsAt = 0;
        document.getElementById('canvasOverlayContainer').innerHTML = '';

        const reasons = {
          opponent_left: ' (상대가 나감)',
          time_up: ' (시간 종료)'
        };
        const isWin = data.winner === currentUser;
        const isDraw = data.winner === 'DRAW';
        const scoreText = (data.scores || []).map(s => `${s.username} ${s.score}`).join(' : ');

        boardMessage = {
          text: isDraw ? 'DRAW' : (isWin ? 'YOU WIN!' : 'YOU LOSE'),
          sub: scoreText
        };
        setStatus(`게임 종료! 승자: ${isDraw ? '무승부' : data.winner}${reasons[data.reason] || ''}`);

        fetchGlobalStats();
        loadLeaderboard();
      });
    }

    function resetMatchmakingButton() {
      document.getElementById('btnMatchmaking').innerText = '1 VS 1';
    }

    function cancelMatchmaking() {
      if (socket) socket.emit('cancelQueue');
      isMatchmaking = false;
      resetMatchmakingButton();
      setStatus('매칭이 취소되었습니다.');
    }

    function toggleMatchmaking() {
      if (!token || !currentUser) return alert('로그인이 필요합니다.');
      if (mode === 'match') return alert('이미 대결 중입니다.');
      if (isMatchmaking) return cancelMatchmaking();

      if (mode === 'single' && game.playing) {
        if (!confirm('진행 중인 게임을 그만두고 1대1 매칭을 시작할까요?')) return;
      }

      initSocket();
      mode = 'idle';
      game.reset();
      boardMessage = { text: '', sub: '' };
      setOpponentBoxVisible(false);

      isMatchmaking = true;
      document.getElementById('btnMatchmaking').innerText = 'CANCEL MATCH';
      setStatus('상대를 찾는 중...');
      socket.emit('joinQueue');
    }

    function sendBoard(force = false) {
      const now = Date.now();
      if (!socket || (!force && now - lastBoardSentAt < BOARD_SEND_INTERVAL_MS)) return;
      lastBoardSentAt = now;
      socket.emit('boardUpdate', game.snapshot());
    }

    function updateMatchStatus() {
      if (!matchEndsAt) return;
      const remaining = Math.max(0, Math.ceil((matchEndsAt - Date.now()) / 1000));
      const time = `${Math.floor(remaining / 60)}:${String(remaining % 60).padStart(2, '0')}`;
      const oppScore = opponentBoard ? opponentBoard.s : 0;
      setStatus(`남은 시간 ${time} · 나 ${game.score} : ${oppScore} ${opponentName}`);
    }

    // ---------- 입력 ----------

    function canvasPoint(e) {
      const rect = canvas.getBoundingClientRect();
      // 화면 좌표를 게임 공간 좌표(PlanetGame.SIZE 기준)로 바꾼다
      return {
        x: (e.clientX - rect.left) * (PlanetGame.SIZE / rect.width),
        y: (e.clientY - rect.top) * (PlanetGame.SIZE / rect.height)
      };
    }

    canvas.addEventListener('pointermove', (e) => {
      if (!game.playing) return;
      const p = canvasPoint(e);
      game.aimAt(p.x, p.y);
    });

    canvas.addEventListener('pointerdown', (e) => {
      if (!game.playing) return;
      // 터치로 조준하다 손가락이 캔버스 밖으로 나가도 떼는 순간 발사되도록 포인터를 붙잡아 둔다
      canvas.setPointerCapture(e.pointerId);
      const p = canvasPoint(e);
      game.aimAt(p.x, p.y);
    });

    canvas.addEventListener('pointerup', (e) => {
      if (!game.playing) return;
      const p = canvasPoint(e);
      game.aimAt(p.x, p.y);
      game.launch();
    });

    const heldKeys = new Set();

    function updateAimDir() {
      const right = heldKeys.has('arrowright') || heldKeys.has('d');
      const left = heldKeys.has('arrowleft') || heldKeys.has('a');
      game.aimDir = (right ? 1 : 0) - (left ? 1 : 0);
    }

    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || !game.playing) return;
      const key = e.key.toLowerCase();

      if (['arrowleft', 'arrowright', 'a', 'd'].includes(key)) {
        heldKeys.add(key);
        updateAimDir();
        e.preventDefault();
      } else if ([' ', 'enter', 'arrowup', 'w'].includes(key)) {
        if (!e.repeat) game.launch();
        e.preventDefault();
      }
    });

    document.addEventListener('keyup', (e) => {
      heldKeys.delete(e.key.toLowerCase());
      updateAimDir();
    });

    window.addEventListener('blur', () => {
      heldKeys.clear();
      updateAimDir();
    });

    // ---------- 화면 그리기 ----------

    let lastFrameAt = performance.now();

    function loop(now) {
      const dt = Math.min((now - lastFrameAt) / 1000, 0.1);
      lastFrameAt = now;

      game.frame(dt);

      const isLight = isLightMode();
      const message = boardMessage.text
        ? boardMessage
        : (mode === 'idle' && !isMatchmaking ? { text: '행성 게임', sub: 'SINGLEPLAYER 또는 1 VS 1을 눌러 시작' } : { text: '', sub: '' });
      PlanetGame.drawBoard(ctx, game.view(), { isLight, message: message.text, subMessage: message.sub });

      if (mode === 'match') {
        if (game.playing) sendBoard();
        updateMatchStatus();
      }

      if (document.getElementById('opponentBox').classList.contains('active')) {
        const view = opponentBoard
          ? { bodies: opponentBoard.b, angle: opponentBoard.a, currentTier: opponentBoard.c, showLauncher: !opponentBoard.o, ready: true, score: opponentBoard.s }
          : { bodies: [], showLauncher: false, score: 0 };
        PlanetGame.drawBoard(oppCtx, view, { isLight, hud: false, message: opponentBoard?.o ? 'GAME OVER' : '' });
      }

      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
