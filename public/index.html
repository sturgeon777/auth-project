<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNAKE.IO</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    .opponent-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .opponent-box h3 {
      margin: 0;
      font-size: 1.1rem;
      color: #ffaa00;
    }
    #opponentCanvas {
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
    }
    .countdown-overlay {
      font-size: 1.5rem;
      font-weight: bold;
      color: #00f0ff;
    }
    .mode-select-box {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <header class="top-header">
    <div class="brand-logo">SNAKE.IO</div>
  </header>

  <div class="top-stats">
    <div class="stat-item">
      <div class="stat-value" id="statTotalPlayers">0</div>
      <div class="stat-label">Total Players</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="statGamesPlayed">0</div>
      <div class="stat-label">Games Played</div>
    </div>
    <div class="stat-item">
      <div class="stat-value" id="statHoursPlayed">0</div>
      <div class="stat-label">Hours Played</div>
    </div>
  </div>

  <div id="authSection" class="auth-container">
    <div class="form-box">
      <h3>Welcome to Snake.io</h3>
      <p class="subtitle">Enter a username to join, or login with your existing account.</p>
      <input type="text" id="authUser" placeholder="USERNAME" required>
      <input type="password" id="authPass" placeholder="PASSWORD" required>
      <button type="button" class="btn-tetrio" onclick="handleAuth()">JOIN</button>
    </div>
  </div>

  <div id="gameSection" style="display: none;">
    <div class="user-bar">
      <div class="user-info">
        USER: <strong id="usernameDisplay"></strong> (BEST SCORE: <strong id="highScoreDisplay">0</strong>)
      </div>
      <button type="button" class="btn-tetrio secondary" style="width: auto; padding: 6px 16px; font-size: 0.9rem;" onclick="logout()">LOGOUT</button>
    </div>

    <div class="controls-panel">
      <button type="button" class="btn-tetrio" style="width: auto; padding: 10px 20px; font-size: 0.95rem;" onclick="startSingleGame()">SINGLEPLAYER</button>
      <button type="button" class="btn-tetrio secondary" id="btnMatchmaking" style="width: auto; padding: 10px 20px; font-size: 0.95rem;" onclick="openMatchModal()">1 VS 1</button>
      <button type="button" class="btn-tetrio secondary" style="width: auto; padding: 10px 20px; font-size: 0.95rem;" onclick="openSkinModal()">SKINS</button>
      <button type="button" class="btn-tetrio secondary" style="width: auto; padding: 10px 20px; font-size: 0.95rem;" onclick="openSettingsModal()">SETTINGS</button>
    </div>

    <p id="gameStatus" class="status-text"></p>

    <div class="layout-container">
      <canvas id="gameCanvas" width="800" height="800"></canvas>
      
      <div id="opponentBox" class="opponent-box" style="display: none;">
        <h3>OPPONENT</h3>
        <canvas id="opponentCanvas" width="400" height="400"></canvas>
      </div>

      <div class="leaderboard-box">
        <h3>TOP 10 LEADERBOARD</h3>
        <ol id="leaderboardList"></ol>
      </div>
    </div>
  </div>

  <!-- 1VS1 모드 선택 모달 -->
  <div id="matchModal" class="modal-overlay">
    <div class="modal-content">
      <h3>SELECT 1VS1 MODE</h3>
      <div class="mode-select-box">
        <button type="button" class="btn-tetrio" onclick="selectMatchMode('shared')">SHARED (공용 맵)</button>
        <button type="button" class="btn-tetrio secondary" onclick="selectMatchMode('individual')">DUAL (독립 맵)</button>
      </div>
      <button type="button" class="btn-tetrio secondary" style="margin-top: 10px;" onclick="closeMatchModal()">CANCEL</button>
    </div>
  </div>

  <!-- 스킨 선택 모달 -->
  <div id="skinModal" class="modal-overlay">
    <div class="modal-content">
      <h3>SELECT SKIN</h3>
      <div class="skin-grid">
        <div class="skin-card" id="card-neon" onclick="selectSkin('neon')">
          <canvas class="skin-preview-canvas" id="prev-neon" width="100" height="100"></canvas>
          <h4>NEON</h4>
        </div>
        <div class="skin-card" id="card-html" onclick="selectSkin('html')">
          <canvas class="skin-preview-canvas" id="prev-html" width="100" height="100"></canvas>
          <h4>HTML TAGS</h4>
        </div>
        <div class="skin-card" id="card-rainbow" onclick="selectSkin('rainbow')">
          <canvas class="skin-preview-canvas" id="prev-rainbow" width="100" height="100"></canvas>
          <h4>RAINBOW</h4>
        </div>
      </div>
      <button type="button" class="btn-tetrio" onclick="closeSkinModal()">CONFIRM</button>
    </div>
  </div>

  <!-- 테마 설정 모달 -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-content">
      <h3>SETTINGS</h3>
      <div class="setting-row">
        <label>THEME MODE</label>
        <div class="theme-btn-group">
          <button type="button" class="btn-tetrio" id="btnThemeDark" onclick="setTheme('dark')">DARK</button>
          <button type="button" class="btn-tetrio secondary" id="btnThemeLight" onclick="setTheme('light')">LIGHT</button>
        </div>
      </div>
      <button type="button" class="btn-tetrio" style="margin-top: 25px;" onclick="closeSettingsModal()">CONFIRM</button>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('jwtToken');
    let currentUser = localStorage.getItem('username');
    let socket = null;
    let gameInterval = null;
    let rainbowHue = 0;
    let currentSkin = 'neon';
    let gameStartTime = 0;
    let inputQueue = [];

    let isMultiplayer = false;
    let isMatchmaking = false;
    let selectedMode = 'shared';

    window.onload = async () => {
      initTheme();
      await fetchGlobalStats();

      token = localStorage.getItem('jwtToken');
      currentUser = localStorage.getItem('username');

      if (token && currentUser) {
        await restoreSession();
      } else {
        showAuthView();
      }
    };

    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      setTheme(savedTheme);
    }

    function setTheme(mode) {
      if (mode === 'light') {
        document.body.classList.add('light-mode');
      } else {
        document.body.classList.remove('light-mode');
      }
      localStorage.setItem('theme', mode);
      updateThemeButtons();
      
      if (typeof drawGame === 'function' && snake.length > 0 && !isMultiplayer) {
        drawGame();
      }
    }

    function updateThemeButtons() {
      const currentTheme = localStorage.getItem('theme') || 'dark';
      const btnDark = document.getElementById('btnThemeDark');
      const btnLight = document.getElementById('btnThemeLight');

      if (!btnDark || !btnLight) return;

      if (currentTheme === 'light') {
        btnLight.classList.remove('secondary');
        btnDark.classList.add('secondary');
      } else {
        btnDark.classList.remove('secondary');
        btnLight.classList.add('secondary');
      }
    }

    function openSettingsModal() {
      document.getElementById('settingsModal').style.display = 'flex';
      updateThemeButtons();
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    async function fetchGlobalStats() {
      try {
        const res = await fetch('/api/stats');
        if (res.ok) {
          const data = await res.json();
          const totalPlayers = (data && data.totalPlayers !== undefined) ? data.totalPlayers : 0;
          const gamesPlayed = (data && data.gamesPlayed !== undefined) ? data.gamesPlayed : 0;
          const hoursPlayed = (data && data.hoursPlayed !== undefined) ? data.hoursPlayed : 0;

          document.getElementById('statTotalPlayers').innerText = Number(totalPlayers).toLocaleString();
          document.getElementById('statGamesPlayed').innerText = Number(gamesPlayed).toLocaleString();
          document.getElementById('statHoursPlayed').innerText = hoursPlayed;
        }
      } catch (e) {
        console.error('Stats load error:', e);
      }
    }

    async function restoreSession() {
      try {
        const res = await fetch('/api/leaderboard');
        let userHighScore = 0;
        if (res.ok) {
          const list = await res.json();
          const found = list.find(item => item.username === currentUser);
          if (found) userHighScore = found.highScore;
        }
        showGameView(userHighScore);
      } catch (e) {
        console.error('Session restore error:', e);
        showGameView(0);
      }
    }

    function showAuthView() {
      document.getElementById('authSection').style.display = 'flex';
      document.getElementById('gameSection').style.display = 'none';
    }

    function showGameView(highScore = 0) {
      document.getElementById('authSection').style.display = 'none';
      document.getElementById('gameSection').style.display = 'block';
      document.getElementById('usernameDisplay').innerText = currentUser || '';
      document.getElementById('highScoreDisplay').innerText = highScore;
      loadLeaderboard();
      fetchGlobalStats();
    }

    async function handleAuth() {
      const username = document.getElementById('authUser').value.trim();
      const password = document.getElementById('authPass').value.trim();
      if (!username || !password) return alert('아이디와 비밀번호를 입력하세요.');

      const loginRes = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (loginRes.ok) {
        const data = await loginRes.json();
        token = data.token;
        currentUser = data.username;
        localStorage.setItem('jwtToken', token);
        localStorage.setItem('username', currentUser);
        showGameView(data.highScore);
      } else {
        const regRes = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (regRes.ok) {
          alert('새 계정이 생성되었습니다.');
          await performLogin(username, password);
        } else {
          alert('비밀번호가 일치하지 않습니다.');
        }
      }
    }

    async function performLogin(username, password) {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (res.ok) {
        token = data.token;
        currentUser = data.username;
        localStorage.setItem('jwtToken', token);
        localStorage.setItem('username', currentUser);
        showGameView(data.highScore);
      }
    }

    function logout() {
      localStorage.removeItem('jwtToken');
      localStorage.removeItem('username');
      location.reload();
    }

    async function loadLeaderboard() {
      try {
        const res = await fetch('/api/leaderboard');
        if (res.ok) {
          const list = await res.json();
          const listEl = document.getElementById('leaderboardList');
          listEl.innerHTML = list.map(item => `<li>${item.username}: ${item.highScore} PTS</li>`).join('');
        }
      } catch (e) {
        console.error('Leaderboard load error:', e);
      }
    }

    function showCountdownUI(count) {
      const statusEl = document.getElementById('gameStatus');
      if (statusEl) {
        statusEl.innerHTML = `<span class="countdown-overlay">${count}</span>`;
      }
    }

    function initSocket() {
      if (socket) return;
      socket = io();

      socket.on('waiting', (data) => {
        document.getElementById('gameStatus').innerText = data?.message || '상대를 찾는 중입니다...';
      });

      socket.on('countdownTick', (data) => {
        showCountdownUI(data.count); 
      });

      socket.on('matchFound', (data) => {
        isMatchmaking = false;
        isMultiplayer = true;
        resetMatchmakingButtons();
        document.getElementById('gameStatus').innerText = `매칭 완료! 상대: ${data.opponent}`;
        if (gameInterval) clearInterval(gameInterval);
      });

      socket.on('gameState', (state) => {
        drawMultiplayerGame(state);
      });

      socket.on('matchOver', (data) => {
        isMultiplayer = false;
        document.getElementById('opponentBox').style.display = 'none';
        document.getElementById('gameStatus').innerText = `게임 종료! 승자: ${data.winner}`;
        fetchGlobalStats();
        loadLeaderboard();
      });
    }

    function openMatchModal() {
      if (isMatchmaking) {
        joinMatchmaking(selectedMode);
        return;
      }
      document.getElementById('matchModal').style.display = 'flex';
    }

    function closeMatchModal() {
      document.getElementById('matchModal').style.display = 'none';
    }

    function selectMatchMode(mode) {
      closeMatchModal();
      joinMatchmaking(mode);
    }

    function resetMatchmakingButtons() {
      const btn = document.getElementById('btnMatchmaking');
      if (btn) btn.innerText = '1 VS 1';
    }

    function joinMatchmaking(mode = 'shared') {
      if (!token || !currentUser) return alert('로그인이 필요합니다.');

      initSocket();

      if (isMatchmaking && selectedMode === mode) {
        socket.emit('cancelQueue');
        isMatchmaking = false;
        resetMatchmakingButtons();
        document.getElementById('gameStatus').innerText = '매칭이 취소되었습니다.';
      } else {
        if (gameInterval) clearInterval(gameInterval);
        isMultiplayer = false;
        isMatchmaking = true;
        selectedMode = mode;
        
        document.getElementById('btnMatchmaking').innerText = 'CANCEL MATCH';
        document.getElementById('gameStatus').innerText = `[${mode.toUpperCase()}] 상대를 찾는 중...`;

        socket.emit('joinQueue', {
          username: currentUser,
          skin: currentSkin,
          token: token,
          mode: mode
        });
      }
    }

    function getHtmlTagForIndex(index, length) {
      if (index === 0) return '<head>';
      if (index === 1) return '</head>';
      if (index === 2) return '<body>';
      if (index === length - 1) return '</body>';
      if (length >= 6 && index === length - 2) return '</div>';
      return '<div>';
    }

    function openSkinModal() {
      document.getElementById('skinModal').style.display = 'flex';
      updateSkinCardSelection();
      renderSkinPreviews();
    }

    function closeSkinModal() {
      document.getElementById('skinModal').style.display = 'none';
    }

    function selectSkin(skinName) {
      currentSkin = skinName;
      updateSkinCardSelection();
    }

    function updateSkinCardSelection() {
      ['neon', 'html', 'rainbow'].forEach(skin => {
        const card = document.getElementById(`card-${skin}`);
        if (skin === currentSkin) card.classList.add('selected');
        else card.classList.remove('selected');
      });
    }

    function renderSkinPreviews() {
      const isLight = document.body.classList.contains('light-mode');

      ['neon', 'html', 'rainbow'].forEach(skin => {
        const cvs = document.getElementById(`prev-${skin}`);
        const pctx = cvs.getContext('2d');
        
        pctx.fillStyle = isLight ? '#ffffff' : '#000000';
        pctx.fillRect(0, 0, 100, 100);

        const dummySnake = [
          {x: 2, y: 1},
          {x: 2, y: 2},
          {x: 2, y: 3},
          {x: 2, y: 4}
        ];
        const size = 20;

        if (skin === 'html') {
          const bgBoxColor = isLight ? '#f0f0f0' : '#0a0a0a';
          const textColor = isLight ? '#0451a5' : '#00ff00';
          const borderColor = isLight ? '#d4d4d4' : '#2d2d2d';

          dummySnake.forEach((part) => {
            pctx.fillStyle = bgBoxColor;
            pctx.fillRect(part.x * size, part.y * size, size - 1, size - 1);
            pctx.strokeStyle = borderColor;
            pctx.strokeRect(part.x * size, part.y * size, size - 1, size - 1);
          });

          dummySnake.forEach((part, idx) => {
            pctx.fillStyle = textColor;
            pctx.font = 'bold 11px monospace';
            pctx.textAlign = 'center';
            pctx.textBaseline = 'middle';
            const tag = getHtmlTagForIndex(idx, dummySnake.length);
            pctx.fillText(tag, part.x * size + size / 2, part.y * size + size / 2);
          });
        } else {
          dummySnake.forEach((part, idx) => {
            const x = part.x * size;
            const y = part.y * size;
            if (skin === 'rainbow') {
              pctx.fillStyle = `hsl(${idx * 40}, 100%, 50%)`;
              pctx.fillRect(x, y, size - 1, size - 1);
            } else {
              pctx.fillStyle = idx === 0 ? '#00f0ff' : '#00a3cc';
              pctx.fillRect(x, y, size - 2, size - 2);
            }
          });
        }
      });
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const oppCanvas = document.getElementById('opponentCanvas');
    const oppCtx = oppCanvas.getContext('2d');

    const gridSize = 20;
    const tileCount = 40;
    let snake = [];
    let food = {x: 5, y: 5};
    let dx = 1, dy = 0;
    let score = 0;

    function generateFood() {
      let newFood;
      do {
        newFood = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      } while (snake.some(part => part.x === newFood.x && part.y === newFood.y));
      return newFood;
    }

    function startSingleGame() {
      if (gameInterval) clearInterval(gameInterval);
      if (isMatchmaking && socket) {
        socket.emit('cancelQueue');
        isMatchmaking = false;
        resetMatchmakingButtons();
      }
      isMultiplayer = false;
      document.getElementById('opponentBox').style.display = 'none';
      
      inputQueue = [];
      snake = [
        {x: 15, y: 15},
        {x: 14, y: 15},
        {x: 13, y: 15},
        {x: 12, y: 15}
      ];
      dx = 1; dy = 0; score = 0;
      gameStartTime = Date.now();
      food = generateFood();
      document.getElementById('gameStatus').innerText = "";
      
      drawGame();
      gameInterval = setInterval(gameLoop, 90);
    }

    function gameLoop() {
      if (inputQueue.length > 0) {
        const nextDir = inputQueue.shift();
        dx = nextDir.dx;
        dy = nextDir.dy;
      }

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        return gameOver();
      }

      const willEat = (head.x === food.x && head.y === food.y);
      const collisionCheckBody = willEat ? snake : snake.slice(0, -1);

      if (collisionCheckBody.some(part => part.x === head.x && part.y === head.y)) {
        return gameOver();
      }

      snake.unshift(head);
      if (willEat) {
        score += 10;
        food = generateFood();
      } else {
        snake.pop();
      }

      drawGame();
    }

    function drawGame() {
      if (!snake || snake.length === 0) return;

      const isLight = document.body.classList.contains('light-mode');

      ctx.fillStyle = isLight ? '#ffffff' : '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      rainbowHue = (rainbowHue + 4) % 360;

      if (currentSkin === 'html') {
        const bgBoxColor = isLight ? '#f0f0f0' : '#0a0a0a';
        const textColor = isLight ? '#0451a5' : '#00ff00';
        const borderColor = isLight ? '#e0e0e0' : '#2d2d2d';

        snake.forEach((part) => {
          const x = part.x * gridSize;
          const y = part.y * gridSize;
          ctx.fillStyle = bgBoxColor;
          ctx.fillRect(x, y, gridSize - 1, gridSize - 1);
          ctx.strokeStyle = borderColor;
          ctx.strokeRect(x, y, gridSize - 1, gridSize - 1);
        });

        snake.forEach((part, index) => {
          const x = part.x * gridSize;
          const y = part.y * gridSize;
          ctx.fillStyle = textColor;
          ctx.font = 'bold 11px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          const tag = getHtmlTagForIndex(index, snake.length);
          ctx.fillText(tag, x + gridSize / 2, y + gridSize / 2);
        });
      } else {
        snake.forEach((part, index) => {
          const x = part.x * gridSize;
          const y = part.y * gridSize;

          if (currentSkin === 'rainbow') {
            const hue = (rainbowHue + index * 12) % 360;
            ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
            ctx.fillRect(x, y, gridSize - 1, gridSize - 1);
          } else {
            ctx.fillStyle = index === 0 ? '#00f0ff' : '#00a3cc';
            ctx.fillRect(x, y, gridSize - 2, gridSize - 2);
          }
        });
      }

      const fx = food.x * gridSize;
      const fy = food.y * gridSize;

      if (currentSkin === 'html') {
        if (isLight) {
          ctx.fillStyle = '#fff1f0';
          ctx.fillRect(fx, fy, gridSize - 1, gridSize - 1);
          ctx.strokeStyle = '#ffa39e';
          ctx.strokeRect(fx, fy, gridSize - 1, gridSize - 1);

          ctx.fillStyle = '#cf1322';
          ctx.font = '900 13px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('<bug>', fx + gridSize / 2, fy + gridSize / 2);
        } else {
          ctx.fillStyle = '#ff0055';
          ctx.fillRect(fx, fy, gridSize - 1, gridSize - 1);

          ctx.fillStyle = '#ffffff';
          ctx.font = '900 13px monospace';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('<bug>', fx + gridSize / 2, fy + gridSize / 2);
        }
      } else {
        ctx.fillStyle = '#ff0055';
        ctx.fillRect(fx, fy, gridSize - 2, gridSize - 2);
      }
    }

    function drawMultiplayerGame(state) {
      if (!state) return;
      const isLight = document.body.classList.contains('light-mode');

      if (state.mode === 'shared') {
        document.getElementById('opponentBox').style.display = 'none';

        ctx.fillStyle = isLight ? '#ffffff' : '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        if (state.food) {
          const fx = state.food.x * gridSize;
          const fy = state.food.y * gridSize;
          ctx.fillStyle = '#ff0055';
          ctx.fillRect(fx, fy, gridSize - 2, gridSize - 2);
        }

        if (state.players && Array.isArray(state.players)) {
          state.players.forEach((player) => {
            const isMe = (player.username === currentUser || player.id === socket?.id);
            player.snake.forEach((part, index) => {
              const x = part.x * gridSize;
              const y = part.y * gridSize;
              ctx.fillStyle = isMe ? (index === 0 ? '#00f0ff' : '#00a3cc') : (index === 0 ? '#ffaa00' : '#cc8800');
              ctx.fillRect(x, y, gridSize - 2, gridSize - 2);
            });
          });
        }
      } else if (state.mode === 'individual') {
        document.getElementById('opponentBox').style.display = 'flex';

        const myPlayer = state.players?.find(p => p.username === currentUser || p.id === socket?.id);
        const opponentPlayer = state.players?.find(p => p !== myPlayer);

        ctx.fillStyle = isLight ? '#ffffff' : '#000000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const myFood = myPlayer?.food || state.food;
        if (myFood) {
          ctx.fillStyle = '#ff0055';
          ctx.fillRect(myFood.x * gridSize, myFood.y * gridSize, gridSize - 2, gridSize - 2);
        }

        if (myPlayer && myPlayer.snake) {
          myPlayer.snake.forEach((part, index) => {
            ctx.fillStyle = index === 0 ? '#00f0ff' : '#00a3cc';
            ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
          });
        }

        const subGridSize = gridSize / 2;
        oppCtx.fillStyle = isLight ? '#f0f0f0' : '#111111';
        oppCtx.fillRect(0, 0, oppCanvas.width, oppCanvas.height);

        const oppFood = opponentPlayer?.food || state.food;
        if (oppFood) {
          oppCtx.fillStyle = '#ff0055';
          oppCtx.fillRect(oppFood.x * subGridSize, oppFood.y * subGridSize, subGridSize - 1, subGridSize - 1);
        }

        if (opponentPlayer && opponentPlayer.snake) {
          opponentPlayer.snake.forEach((part, index) => {
            oppCtx.fillStyle = index === 0 ? '#ffaa00' : '#cc8800';
            oppCtx.fillRect(part.x * subGridSize, part.y * subGridSize, subGridSize - 1, subGridSize - 1);
          });
        }
      }
    }

    async function gameOver() {
      clearInterval(gameInterval);
      document.getElementById('gameStatus').innerText = `GAME OVER! SCORE: ${score}`;
      
      const playSeconds = Math.floor((Date.now() - gameStartTime) / 1000);

      try {
        await fetch('/api/score', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ score, playSeconds })
        });
      } catch (e) {
        console.error('Score submit error:', e);
      }

      const currentHigh = parseInt(document.getElementById('highScoreDisplay').innerText) || 0;
      if (score > currentHigh) {
        document.getElementById('highScoreDisplay').innerText = score;
      }

      loadLeaderboard();
      fetchGlobalStats();
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      let newDir = null;

      if (e.key === 'ArrowUp' || key === 'w') newDir = { dx: 0, dy: -1 };
      if (e.key === 'ArrowDown' || key === 's') newDir = { dx: 0, dy: 1 };
      if (e.key === 'ArrowLeft' || key === 'a') newDir = { dx: -1, dy: 0 };
      if (e.key === 'ArrowRight' || key === 'd') newDir = { dx: 1, dy: 0 };

      if (newDir) {
        if (isMultiplayer && socket) {
          socket.emit('playerInput', newDir);
        } else {
          const lastDir = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : { dx, dy };
          if (newDir.dx !== -lastDir.dx || newDir.dy !== -lastDir.dy) {
            if (inputQueue.length < 2) {
              inputQueue.push(newDir);
            }
          }
        }
      }
    });
  </script>
